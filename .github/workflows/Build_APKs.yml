name: 📦 Extract Custom Files

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'HyperOS ROM 下载链接 (卡刷包 .zip)'
        required: true
        type: string
      file_patterns:
        description: ' (多个用空格分隔，例如: *.apk *.jar *.conf MSA.apk)'
        required: true
        default: '*.apk *.jar'
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Environment
        run: |
          echo "=== 1. 初始化环境 ==="
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -yqq aria2 p7zip-full
          
          # 赋予提取工具权限
          chmod -R +x tools/

      - name: Download ROM with Aria2
        run: |
          echo "📥 下载 ROM 中..."
          aria2c -x16 -s16 -j$(nproc) -U "Mozilla/5.0" -d . "${{ github.event.inputs.rom_url }}" -o rom.zip

      - name: Extract Payload and Partitions
        run: |
          echo "📦 提取 Payload..."
          7z e rom.zip payload.bin > /dev/null
          rm rom.zip
          
          echo "🛠️ 提取 System, Product, System_Ext..."
          mkdir -p extracted_images
          ./tools/payload_extract -s -o extracted_images -i payload.bin -X system,product,system_ext -T0
          rm payload.bin

      - name: Extract EROFS
        run: |
          echo "📂 解包 EROFS 镜像..."
          mkdir -p system_files product_files system_ext_files
          
          cd system_files && sudo ../tools/extract.erofs -i ../extracted_images/system.img -x -s && cd ..
          cd product_files && sudo ../tools/extract.erofs -i ../extracted_images/product.img -x -s && cd ..
          cd system_ext_files && sudo ../tools/extract.erofs -i ../extracted_images/system_ext.img -x -s && cd ..
          
          sudo rm -rf extracted_images

      - name: Collect and Archive Target Files
        run: |
          echo "🔍 寻找并收集目标文件..."
          mkdir -p extracted_target
          
          # 读取用户输入的文件匹配模式 (例如: *.apk *.jar)
          PATTERNS="${{ github.event.inputs.file_patterns }}"
          
          # 遍历解包目录，按模式搜索。使用 cp --parents 保留相对目录结构，防止同名文件互相覆盖
          for pattern in $PATTERNS; do
            echo "正在提取匹配项: $pattern"
            sudo find system_files product_files system_ext_files -type f -name "$pattern" -exec cp --parents {} extracted_target/ \; 2>/dev/null || true
          done
          
          echo "🗜️ 正在打包提取出的文件..."
          cd extracted_target
          # 将提取的内容压缩成 ZIP 文件，方便下载
          7z a -tzip ../extracted_custom_files.zip *
          
          echo "✅ 提取并打包完成！"

      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload Extracted Files to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Custom-Extraction-${{ steps.tag.outputs.release_tag }}
          name: "📦 自定义文件提取 - ${{ steps.tag.outputs.release_tag }}"
          body: |
            ### 提取完成
            **源 ROM**: ${{ github.event.inputs.rom_url }}
            **提取规则**: ${{ github.event.inputs.file_patterns }}
            
            ⚠️ **注意**: 这些是未经任何修改的官方原版文件，压缩包内已保留原文件在 ROM 中的路径结构。
          files: extracted_custom_files.zip
          draft: false
          prerelease: false
